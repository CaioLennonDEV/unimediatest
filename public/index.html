<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Bloub</title>

  <!-- Previne erros de extensões de terceiros que injetam scripts de drag-and-drop -->
  <script>
    window.hideOriginalWhileDragging = false;
  </script>

  <!-- Estilos Kiosk Ultra Minimalistas -->
  <link rel="stylesheet" href="/css/kiosk.css" />
</head>
<body class="kiosk-body">

  <main id="kiosk-screen" class="kiosk-container" role="button" aria-label="Toque para interagir">
    <div id="avatar-stage" class="eyes-stage" data-state="idle">
      <svg
        id="bloub-eyes-svg"
        viewBox="-60 -110 180 120"
        role="img"
        aria-label="Olhos do Bloub"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- Olho Esquerdo Original de test.txt -->
        <path
          id="bloub-eye-left"
          class="bloub-eye"
          d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
          transform="matrix(0.89,-0.34,0.43,0.83,11.67,-45.56)"
        />
        <!-- Olho Direito Original de test.txt -->
        <path
          id="bloub-eye-right"
          class="bloub-eye"
          d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
          transform="matrix(0.7,-0.06,0.43,0.83,55.89,-56.47)"
        />
      </svg>
    </div>
  </main>

  <!-- Scripts Modulares da Aplicação -->
  <script src="/js/avatar.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
